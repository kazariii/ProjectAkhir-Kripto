[platformio]
default_envs = pqc-telemetry-public

; Archived TLS firmware. Select explicitly only for a deliberate rollback.
[env:esp32dev]
lib_ldf_mode = chain+
build_src_filter = +<main.cpp>
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6

; Isolated ticket-01 proof. Requires a locally generated private fixture header.
[env:pqc-proof]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<pqc_probe.cpp>
build_flags =
    -DMLK_CONFIG_PARAMETER_SET=512
    -DMLK_CONFIG_NAMESPACE_PREFIX=pqc_mlkem
    -DMLK_CONFIG_NO_RANDOMIZED_API
    -DMLK_CONFIG_SERIAL_FIPS202_ONLY
    -DFNDSA_AVX2=0
    -DFNDSA_SSE2=0
    -DFNDSA_NEON=0
    -DCONFIG_MBEDTLS_CHACHA20_C
    -DCONFIG_MBEDTLS_POLY1305_C
    -DCONFIG_MBEDTLS_CHACHAPOLY_C
    -DCONFIG_MBEDTLS_HKDF_C

[env:mqtt-diagnostic]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<mqtt_diagnostic.cpp>
lib_deps = knolleary/PubSubClient@2.8

; Primary firmware: real sensors/local alarms with application crypto over MQTT/TCP.
[env:pqc-telemetry]
lib_ldf_mode = chain+
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
build_flags =
    ${env:pqc-proof.build_flags}
    -DPQC_TELEMETRY
    -Iinclude
lib_deps =
    knolleary/PubSubClient@2.8
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6

; Ticket-03 interactive session; private identity + MQTT headers stay ignored.
[env:pqc-session]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<mqtt_session.cpp>
build_flags = ${env:pqc-proof.build_flags}
lib_deps = knolleary/PubSubClient@2.8

; Spike for Wokwi web (wokwi-web-broker-publik ticket 01): public broker, no
; account, unique topic prefix, 1519-byte echo. Contains no secrets.
[env:mqtt-diagnostic-public]
extends = env:mqtt-diagnostic
build_flags =
    '-DPQC_BROKER_HOST="broker.emqx.io"'
    '-DDIAG_TOPIC_PREFIX="lkpqc-b16bef88/diag"'

; Wokwi web build (wokwi-web-broker-publik ticket 03): public broker, unique topic
; prefix, separate demo identity. Prefix must equal "topic_prefix" in the public
; receiver settings. Contains the demo client key; do not use the lab identity here.
[env:pqc-telemetry-public]
extends = env:pqc-telemetry
build_flags =
    ${env:pqc-telemetry.build_flags}
    '-DPQC_BROKER_HOST="broker.emqx.io"'
    '-DPQC_TOPIC_PREFIX="lkpqc-b16bef88/session"'
    '-DPQC_IDENTITY_HEADER="pqc_session_identity_demo.h"'
