apiVersion: 1
datasources:
  - name: InfluxDB Suhu
    uid: influx-suhu
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: lab-kimia
      defaultBucket: telemetry
    secureJsonData:
      token: $INFLUX_TOKEN
