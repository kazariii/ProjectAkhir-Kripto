[agent]
  flush_interval = "2s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["ssl://${MQTT_HOST}:8883"]
  topics = ["lab/kimia/meja01/telemetry"]
  client_id = "telegraf-meja01"
  username = "${MQTT_TELEGRAF_USERNAME}"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  qos = 0
  persistent_session = false
  connection_timeout = "10s"
  tls_ca = "/etc/telegraf/emqx-ca.pem"
  insecure_skip_verify = false
  topic_tag = ""
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "suhu"
    # No timestamp_path: use the receiving Telegraf clock.
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperature_c"
      type = "float"
      optional = false
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"
      optional = false

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "lab-kimia"
  bucket = "telemetry"
