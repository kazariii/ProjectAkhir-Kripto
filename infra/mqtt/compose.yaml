name: lab-kimia-mqtt-pqc

services:
  broker:
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    user: "1883:1883"
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_ADDRESS:?Set the private LXC IPv4 address}:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./acl:/mosquitto/config/acl:ro
      - ../../evidence/local/mqtt-private/passwords:/mosquitto/config/passwords:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
